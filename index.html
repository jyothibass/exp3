<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleShop - E-Commerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">SimpleShop</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <button id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div>
        <h1>Welcome to SimpleShop</h1>
        <p>Find quality products at simple prices.</p>
        <a class="shop-btn" href="#products">Shop Now</a>
      </div>
    </section>

    <section id="products" class="products-section">
      <h2>Our Products</h2>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <aside id="cartPanel" class="cart-panel">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="closeCart">&times;</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <strong>Total: ₹<span id="cartTotal">0</span></strong>
      <button id="checkoutBtn" class="checkout-btn">Checkout</button>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>

  <footer>
    <p>&copy; 2026 SimpleShop. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
